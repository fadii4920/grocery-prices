<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بَسعار - قارن أسعار الجروسري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1f7a4d;--gl:#e7f4ec;--bg:#f6f9f7;--c:#fff;--b:#e3e9e5;--t:#14201a;--m:#6b7a71;--r:#c0392b;--o:#d98a00}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
.wrap{max-width:1000px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:22px;color:var(--g)}
.btn{border:1px solid var(--b);background:var(--c);border-radius:12px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--g);color:#fff;border-color:var(--g)}
.banner{background:#fff3cd;color:#664d03;padding:8px 14px;text-align:center;font-size:13px;font-weight:600}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--b);border-radius:14px;font:inherit;background:var(--c);margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1px solid var(--b);background:var(--c);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--m)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip.s.on{background:var(--gl);color:var(--g);border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card .img{height:90px;border-radius:12px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.card .img img{max-height:100%;max-width:100%}
.card h3{margin:6px 0 0;font-size:14px;line-height:1.5}
.small{font-size:12px;color:var(--m)}
.price{font-weight:800;color:var(--g);font-size:17px}
.empty{text-align:center;color:var(--m);padding:50px 10px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--c);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b)}
.row:last-child{border:0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;margin-inline-start:6px}
.tag.ok{background:var(--gl);color:var(--g)}.tag.bad{background:#fdecea;color:var(--r)}.tag.w{background:#fff3cd;color:#8a5a00}.tag.n{background:#eef1ef;color:var(--m)}
.best{color:var(--g);font-weight:800}
.out{opacity:.5;text-decoration:line-through}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--b);background:#fff;font-size:18px;cursor:pointer}
h2{margin:0 0 6px;font-size:18px}
svg{width:100%;height:auto;direction:ltr}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
</style>
</head>
<body>
<div id="banner"></div>
<header><div class="wrap">
  <div class="top"><div class="logo">🛒 بَسعار</div><button class="btn p" id="basketBtn">السلة (0)</button></div>
  <input type="search" id="q" placeholder="ابحث عن منتج... لبن، زبادي، بيض">
  <div class="chips" id="cats"></div>
  <div class="chips" id="subs"></div>
</div></header>
<main class="wrap"><div id="list"></div><p class="small" id="upd"></p></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g,' ').trim();
const money=n=>Number(n).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
const COLORS=['#1f7a4d','#2563eb','#d98a00','#c026d3','#0891b2','#dc2626'];
let D=null,cat='all',sub='all',q='';
let basket={};try{basket=JSON.parse(localStorage.getItem('basket')||'{}')}catch(e){}
const saveBasket=()=>{try{localStorage.setItem('basket',JSON.stringify(basket))}catch(e){}};

fetch('prices.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;init()}).catch(()=>{$('#list').innerHTML='<div class="empty">مش قادر أحمّل ملف الأسعار (prices.json). اتأكد إنه مرفوع جنب index.html.</div>'});

function init(){
  if(D.demo)$('#banner').innerHTML='<div class="banner">⚠️ دي أرقام تجريبية لتجربة الموقع بس، مش أسعار حقيقية</div>';
  $('#upd').textContent='آخر تحديث للأسعار: '+(D.updated||'غير معروف');
  renderCats();renderList();updateBasketBtn();
  $('#q').addEventListener('input',e=>{q=norm(e.target.value);renderList()});
  $('#basketBtn').onclick=openBasket;
  $('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
}
function renderCats(){
  $('#cats').innerHTML=chip('all','الكل',cat==='all','c')+D.categories.filter(c=>D.products.some(p=>p.category===c.key)).map(c=>chip(c.key,(c.emoji||'')+' '+c.name,cat===c.key,'c')).join('');
  const c=D.categories.find(x=>x.key===cat);
  $('#subs').innerHTML=c&&c.subs?chip('all','كل الأقسام الفرعية',sub==='all','s')+c.subs.filter(s=>D.products.some(p=>p.category===c.key&&p.sub===s.key)).map(s=>chip(s.key,s.name,sub===s.key,'s')).join(''):'';
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    if(b.dataset.t==='c'){cat=b.dataset.k;sub='all'}else sub=b.dataset.k;
    renderCats();renderList();
  });
}
const chip=(k,n,on,t)=>`<button class="chip ${t==='s'?'s ':''}${on?'on':''}" data-k="${esc(k)}" data-t="${t}">${esc(n)}</button>`;
function entries(p){return Object.entries(p.prices||{}).filter(([s,e])=>e&&e.price>0).map(([s,e])=>({store:s,...e}))}
function best(p){const a=entries(p).filter(e=>e.in_stock!==false);return a.length?a.reduce((x,y)=>y.price<x.price?y:x):null}
function catEmoji(p){const c=D.categories.find(x=>x.key===p.category);return c?.emoji||'🛒'}
function renderList(){
  const L=D.products.filter(p=>(cat==='all'||p.category===cat)&&(sub==='all'||p.sub===sub)&&(!q||norm(p.name+' '+(p.unit||'')+' '+(p.brand||'')).includes(q)));
  if(!L.length){$('#list').innerHTML='<div class="empty">'+(D.products.length?'مفيش منتجات مطابقة':'لسه مفيش منتجات. الأسعار هتظهر هنا أول ما تتحدّث.')+'</div>';return}
  $('#list').innerHTML='<p class="small">'+L.length.toLocaleString('ar-EG')+' منتج</p><div class="grid">'+L.map(p=>{
    const b=best(p),n=entries(p).length;
    return `<div class="card" data-id="${esc(p.id)}"><div class="img">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${catEmoji(p)}'))">`:catEmoji(p)}</div><h3>${esc(p.name)}</h3><div class="small">${esc(p.unit||'')}</div><div class="small">${b?'يبدأ من':'غير متوفر'}</div><div class="price">${b?money(b.price):'-'}</div><div class="small">${n.toLocaleString('ar-EG')} محل</div></div>`}).join('')+'</div>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openProduct(c.dataset.id));
}
// تحليل العرض: بيقارن السعر الحالي بمتوسط آخر 30 يوم
function analyze(e){
  const h=(e.history||[]).slice(0,-1).filter(([d])=>Date.now()-new Date(d)<=30*864e5);
  if(h.length<7)return{k:'n',t:'مفيش تاريخ كفاية للحكم (محتاج أسبوع على الأقل)'};
  const avg=h.reduce((s,x)=>s+x[1],0)/h.length,diff=(avg-e.price)/avg*100;
  if(e.offer){
    return diff>=5?{k:'ok',t:`عرض حقيقي: أقل من متوسط الشهر (${money(avg)}) بنسبة ${Math.round(diff).toLocaleString('ar-EG')}%`}
                  :{k:'bad',t:`العرض ده مش حقيقي: السعر قريب من متوسط الشهر (${money(avg)})`};
  }
  if(diff>=5)return{k:'w',t:`نزل ${Math.round(diff).toLocaleString('ar-EG')}% عن متوسط الشهر (${money(avg)})`};
  if(diff<=-5)return{k:'w',t:`أغلى ${Math.round(-diff).toLocaleString('ar-EG')}% من متوسط الشهر (${money(avg)})`};
  return null;
}
const sname=id=>D.stores.find(s=>s.id===id)?.name||id;
const snote=id=>D.stores.find(s=>s.id===id)?.note||'';
function openProduct(id){
  const p=D.products.find(x=>x.id===id),E=entries(p).sort((a,b)=>(b.in_stock!==false)-(a.in_stock!==false)||a.price-b.price),b=best(p);
  $('#sheet').innerHTML=`<h2>${esc(p.name)}</h2><div class="small">${esc(p.unit||'')}</div>
  <div style="margin:10px 0">${E.map(e=>{const a=analyze(e),oos=e.in_stock===false;return `<div class="row"><div><span class="${oos?'out':''}">${esc(sname(e.store))}</span>${b&&e.store===b.store?'<span class="tag ok">الأرخص</span>':''}${oos?'<span class="tag n">غير متوفر</span>':''}${e.offer?'<span class="tag w">عرض</span>':''}${snote(e.store)?`<div class="small">${esc(snote(e.store))}</div>`:''}${e.old_price?`<div class="small">المحل بيقول إن السعر قبل العرض ${money(e.old_price)}${e.discount_pct?' (خصم '+e.discount_pct.toLocaleString('ar-EG')+'%)':''}</div>`:(e.discount_pct?`<div class="small">المحل بيقول خصم ${e.discount_pct.toLocaleString('ar-EG')}%</div>`:'')}${a?`<div class="small"><span class="tag ${a.k}">${esc(a.t)}</span></div>`:''}</div><div class="${b&&e.store===b.store?'best':''} ${oos?'out':''}">${money(e.price)}</div></div>`}).join('')||'<div class="empty">مفيش أسعار</div>'}</div>
  ${chart(E)}
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn p" id="add">أضف للسلة</button><button class="btn" id="close">إغلاق</button></div>`;
  $('#add').onclick=()=>{basket[id]=(basket[id]||0)+1;saveBasket();updateBasketBtn();closeModal()};
  $('#close').onclick=closeModal;$('#modal').classList.add('on');
}
function chart(E){
  const S=E.filter(e=>(e.history||[]).length>1);
  if(!S.length)return '<div class="small">الرسم البياني هيظهر لما يتجمّع تاريخ أسعار لأكتر من يوم.</div>';
  const pts=S.flatMap(e=>e.history.map(([d,p])=>[+new Date(d),p])),x0=Math.min(...pts.map(a=>a[0])),x1=Math.max(...pts.map(a=>a[0])),y0=Math.min(...pts.map(a=>a[1]))*.97,y1=Math.max(...pts.map(a=>a[1]))*1.03;
  const X=t=>20+(x1===x0?0:(t-x0)/(x1-x0))*560,Y=v=>170-(v-y0)/(y1-y0||1)*150;
  return `<h2 style="font-size:15px;margin-top:6px">سجل السعر</h2><svg viewBox="0 0 600 190"><line x1="20" y1="170" x2="580" y2="170" stroke="#e3e9e5"/><text x="20" y="186" font-size="11" fill="#6b7a71">${new Date(x0).toISOString().slice(0,10)}</text><text x="580" y="186" font-size="11" fill="#6b7a71" text-anchor="end">${new Date(x1).toISOString().slice(0,10)}</text><text x="20" y="14" font-size="11" fill="#6b7a71">${y1.toFixed(0)}</text><text x="20" y="166" font-size="11" fill="#6b7a71">${y0.toFixed(0)}</text>${S.map((e,i)=>`<polyline fill="none" stroke="${COLORS[i%6]}" stroke-width="2" points="${e.history.map(([d,p])=>X(+new Date(d)).toFixed(1)+','+Y(p).toFixed(1)).join(' ')}"/>`).join('')}</svg><div class="legend">${S.map((e,i)=>`<span><i style="background:${COLORS[i%6]}"></i>${esc(sname(e.store))}</span>`).join('')}</div>`;
}
function updateBasketBtn(){const n=Object.values(basket).reduce((a,b)=>a+b,0);$('#basketBtn').textContent='السلة ('+n.toLocaleString('ar-EG')+')'}
function openBasket(){
  const ids=Object.keys(basket).filter(i=>basket[i]>0&&D.products.some(p=>p.id===i));
  if(!ids.length){$('#sheet').innerHTML='<h2>السلة فاضية</h2><p class="small">افتح أي منتج واضغط "أضف للسلة".</p><button class="btn" id="close">إغلاق</button>';$('#close').onclick=closeModal;$('#modal').classList.add('on');return}
  const items=ids.map(i=>({p:D.products.find(x=>x.id===i),n:basket[i]}));
  const totals=D.stores.map(s=>{
    let sum=0,miss=0;
    items.forEach(({p,n})=>{const e=p.prices?.[s.id];if(e&&e.price>0&&e.in_stock!==false)sum+=e.price*n;else miss++});
    const fee=(s.free_over&&sum>=s.free_over)?0:(s.delivery_fee||0);
    return{s,sum,miss,fee,total:sum+(miss<items.length?fee:0)};
  }).sort((a,b)=>a.miss-b.miss||a.total-b.total);
  $('#sheet').innerHTML=`<h2>سلتي</h2>${items.map(({p,n})=>`<div class="row"><div>${esc(p.name)}<div class="small">${esc(p.unit||'')}</div></div><div class="qty"><button data-i="${esc(p.id)}" data-d="-1">−</button><b>${n.toLocaleString('ar-EG')}</b><button data-i="${esc(p.id)}" data-d="1">+</button></div></div>`).join('')}
  <h2 style="margin-top:14px;font-size:15px">إجمالي السلة في كل محل (شامل التوصيل)</h2>${totals.map((t,i)=>`<div class="row"><div>${esc(t.s.name)}${i===0&&t.miss===0?'<span class="tag ok">الأوفر</span>':''}${t.miss?`<div class="small">ناقص ${t.miss.toLocaleString('ar-EG')} منتج مش متوفر هنا</div>`:''}<div class="small">منتجات ${money(t.sum)} + توصيل ${money(t.fee)}</div></div><div class="${i===0&&t.miss===0?'best':''}">${money(t.total)}</div></div>`).join('')}
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="clear">فضّي السلة</button><button class="btn p" id="close">إغلاق</button></div>`;
  $('#sheet').querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{const i=b.dataset.i;basket[i]=Math.max(0,(basket[i]||0)+Number(b.dataset.d));if(!basket[i])delete basket[i];saveBasket();updateBasketBtn();openBasket()});
  $('#clear').onclick=()=>{basket={};saveBasket();updateBasketBtn();closeModal()};$('#close').onclick=closeModal;$('#modal').classList.add('on');
}
function closeModal(){$('#modal').classList.remove('on')}
</script>
</body>
</html>
